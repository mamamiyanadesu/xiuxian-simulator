color:#7c352b;color:#fff6e6}.a-choice:first-child small{color:#f1d7ca}.a-choice:last-child{border-color:transparent;min-height:40px;justify-content:center;font-size:13px;color:#736654}.a-feedback{background:#e8dfc9;padding:12px 14px;color:#593f31;font-size:14px;margin:10px 0}.a-feedback[hidden]{display:none}.a-tools{display:flex;justify-content:space-between;gap:10px;padding-top:14px;border-top:1px solid #cfc4ac;margin-top:8px}.a-tools button{border:0;background:transparent;color:#655b4c;font-size:13px;padding:5px 3px}.a-tools button:last-child{color:#8a382c}.a-note{font-size:11px;color:#776d5c;text-align:right;margin-top:7px}@media(max-width:380px){.a{padding:21px 19px 15px}.a-title{font-size:26px}.a-story{padding-top:20px}.a-choice{gap:6px;padding:10px}.a-choice small{font-size:11px}}

<header class="a-head"><h1 class="a-title">此劫难渡</h1><span class="a-seal">散修手记</span></header>
<div class="a-stats" aria-label="修行状态"><div><span class="a-stat-label">修为 · 筑基</span><strong class="a-stat-val">40 <small>/ 100</small></strong><div class="a-meter"><span></span></div></div><div><span class="a-stat-label">剩余寿元</span><strong class="a-stat-val"><span id="a-life">18</span></strong></div><div><span class="a-stat-label">心魔</span><strong class="a-stat-val">0 <small>/ 100</small></strong></div></div>
<section class="a-story"><div class="a-event-head"><h2>最后一炉</h2><span>坊市 · 丹药</span></div>
<p>摊主正在拆招牌。见你停下，他又把“清仓”二字扶正了。</p>
<p class="a-dialogue">“最后一炉养元丹。家师闭关去了，往后有灵石也买不着。”</p>
<p>桌上剩下三瓶，封口都很新。旁边竹篓里却有几十张揭下来的旧丹签。你认出其中一张，上个月来时就贴在这里。</p>
<p>你问为何换签。他捻掉瓶底一点红末。</p>
<p class="a-dialogue">“师父嫌从前的字不吉利，耽误药效。”</p><p>他愿意拿一瓶抵工钱，只需你替他温炉半日。若肯帮着把旧丹重新封好，整炉余药都归你。</p></section>
<div class="a-clues" aria-label="可见线索"><span class="a-clue">新封口</span><span class="a-clue">旧丹签</span><span class="a-clue" id="a-clue">瓶底红末</span></div>
<div class="a-choices"><button class="a-choice" id="a-investigate"><span>先讨半粒，验一验药</span><small>寿元 −1</small></button><button class="a-choice" data-a-result="温炉换得一瓶丹药。运功时，鼻端隐约传来一丝焦甜味。"><span>只取一瓶</span><small>稳妥取舍</small></button><button class="a-choice" data-a-result="你收下余药，修为增长得很快。瓶底的红末，也随药一同入了腹。"><span>包下余药</span><small>收益高 · 风险高</small></button><button class="a-choice" data-a-result="你记住瓶底的丹号，转身走进坊市。"><span>记住丹号，离开此处</span></button></div>
<p class="a-feedback" id="a-feedback" role="status" hidden></p>
<footer class="a-tools"><button data-a-result="目前没有查明的隐患。出现身体征兆后，可用内观辨认。">内观</button><button data-a-result="此刻心魔为零，无需静心。">静心</button><button data-a-result="修为尚未圆满，暂不能渡劫。">准备渡劫 ↗</button></footer><div class="a-note">方向样机</div>
</main><script>
const af=document.getElementById('a-feedback');function showA(text){af.textContent=text;af.hidden=false}document.getElementById('a-investigate').addEventListener('click',()=>{document.getElementById('a-life').textContent='17';document.getElementById('a-investigate').disabled=true;document.getElementById('a-clue').textContent='查明 · 杂质未炼净';showA('药力虽足，杂质却未炼净。重新炼化需要时间，可以除去丹毒。');});document.querySelectorAll('[data-a-result]').forEach(el=>el.addEventListener('click',()=>showA(el.dataset.aResult)));
</script></body></html>
