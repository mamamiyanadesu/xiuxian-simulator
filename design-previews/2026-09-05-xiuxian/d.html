<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>此劫难渡 · 山野行笺</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#eef1e9;color:#283d32;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}.d-root{max-width:640px;margin:auto;padding:24px 27px 18px;min-height:690px}.d-top{display:flex;justify-content:space-between;align-items:center;gap:12px}.d-brand{font-size:17px;letter-spacing:.1em;font-weight:600}.d-identity{font-size:12px;color:#627267;white-space:nowrap}.d-route{margin:13px 0 16px;display:flex;gap:5px;align-items:center;color:#69786b;font-size:11px;letter-spacing:.04em}.d-route span{height:1px;max-width:40px;background:#a6b4a6;flex:1}.d-route b{width:5px;height:5px;background:#526f56;border-radius:50%;font-weight:400}.d-metrics{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:21px;padding-bottom:20px;border-bottom:1px solid #c8d2c4}.d-label{font-size:12px;color:#5d6f60}.d-value{font-family:Georgia,serif;font-size:27px;line-height:1.35;font-variant-numeric:tabular-nums}.d-value small{font-family:inherit;font-size:14px;color:#75806f}.d-track{height:3px;background:#d5ddd0;margin-top:6px;overflow:hidden}.d-track i{display:block;height:100%;background:#4a704e;font-style:normal}.d-track.life i{background:#8d9163}.d-eventhead{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:20px 0 12px}.d-eventhead p{font-size:11px;color:#667662;margin:0 0 6px;letter-spacing:.15em}.d-eventhead h1{font-size:27px;line-height:1.2;margin:0;font-weight:500;letter-spacing:.09em}.d-location{font-size:12px;color:#697665;text-align:right;line-height:1.8;white-space:nowrap}.d-location span{display:block;color:#465e46;font-size:14px}.d-story{font-size:15px;line-height:1.76;color:#334536;max-width:36em}.d-story p{margin:0 0 10px}.d-clues{margin:15px 0 17px;display:flex;flex-wrap:wrap;align-items:center;gap:7px;font-size:11px;color:#5b6d58}.d-clues-label{margin-right:3px}.d-clue{border:1px solid #c5d1bd;border-radius:20px;padding:4px 9px;background:#f4f6ee;color:#4c6447;font:inherit;min-height:29px;cursor:pointer}.d-clue:hover{background:#e2e9d8}.d-cluenote{font-size:13px;color:#42553e;line-height:1.7;margin:-5px 0 15px;background:#e0e7d7;border-radius:3px;padding:10px 12px}.d-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.d-action{min-height:66px;border:1px solid #b6c3ae;border-radius:5px;text-align:left;background:#f8f9f2;color:#324931;padding:11px 12px;cursor:pointer;font:inherit}.d-action strong{display:flex;justify-content:space-between;gap:5px;font-weight:500;font-size:15px}.d-action small{display:block;font-size:11px;line-height:1.5;margin-top:5px;color:#68775f}.d-action:first-child{background:#3c603f;border-color:#3c603f;color:#fffdf2}.d-action:first-child small{color:#e0e8d8}.d-action:hover{border-color:#4b7042;box-shadow:0 0 0 1px #4b7042}.d-action:active{transform:translateY(1px)}.d-arrow{font-size:15px;font-family:Arial,sans-serif;font-weight:400}.d-tools{margin:18px 0 0;padding-top:13px;border-top:1px solid #c8d2c4;display:flex;align-items:center;gap:6px}.d-tools button{background:transparent;border:0;color:#4a6245;font:inherit;font-size:13px;padding:8px 10px;min-height:38px;cursor:pointer;border-radius:3px}.d-tools button:hover{background:#e0e7d7}.d-tools .d-tribulation{margin-left:auto;color:#64715c;border:1px solid #bcc8b3;font-size:12px;padding:8px 12px}.d-tools .d-tribulation:disabled{cursor:default;color:#78816e;background:#e6eadf}.d-note{font-size:11px;line-height:1.7;color:#63705e;margin:10px 0 0}button:focus-visible{outline:2px solid #254d2f;outline-offset:3px}@media(max-width:350px){.d-root{padding:20px 17px 16px}.d-metrics{gap:14px}.d-action{padding:10px}.d-identity{font-size:11px}.d-eventhead h1{font-size:26px}}
</style>
</head>
<body>
<main class="d-root">
 <header class="d-top"><div class="d-brand">此劫难渡</div><div class="d-identity">筑基散修 · 独自行路</div></header>
 <div class="d-route" aria-label="当前行程：青岚坊"><b></b>山门之外<span></span><b></b>青岚坊<span></span>金丹未至</div>
 <section class="d-metrics" aria-label="修行状态">
  <div><div class="d-label">修为</div><div class="d-value">40<small> / 100</small></div><div class="d-track"><i style="width:40%"></i></div></div>
  <div><div class="d-label">余寿</div><div class="d-value">18</div><div class="d-track life"><i style="width:100%"></i></div></div>
  <div><div class="d-label">心魔</div><div class="d-value">0</div><div class="d-track"><i style="width:0%"></i></div></div>
 </section>
 <section aria-labelledby="d-title">
  <div class="d-eventhead"><div><p>坊市偶遇 · 丹药</p><h1 id="d-title">最后一炉</h1></div><div class="d-location">山路第三站<span>日暮收摊时</span></div></div>
  <div class="d-story">
   <p>摊主正在拆招牌。见你停下，他又把“清仓”二字扶正了。</p>
   <p>“最后一炉养元丹。家师闭关去了，往后有灵石也买不着。”</p>
   <p>桌上剩下三瓶，封口都很新。旁边竹篓里却有几十张揭下来的旧丹签。你认出其中一张，上个月来时就贴在这里。</p>
   <p>你问为何换签。他捻掉瓶底一点红末。“师父嫌从前的字不吉利，耽误药效。”</p>
   <p>他愿意拿一瓶抵工钱，只需你替他温炉半日。若肯帮着把旧丹重新封好，整炉余药都归你。</p>
  </div>
  <div class="d-clues"><span class="d-clues-label">留意到</span><button class="d-clue" type="button" aria-controls="d-cluenote" aria-expanded="false">新封口</button><button class="d-clue" type="button" aria-controls="d-cluenote" aria-expanded="false">旧丹签</button><button class="d-clue" type="button" aria-controls="d-cluenote" aria-expanded="false">瓶底红末</button></div>
  <p id="d-cluenote" class="d-cluenote" hidden></p>
  <div class="d-actions" aria-label="决定下一步">
   <button class="d-action" type="button"><strong>先验药<span class="d-arrow">↗</span></strong><small>余寿 −1 · 查明一条线索</small></button>
   <button class="d-action" type="button"><strong>只取一瓶<span class="d-arrow">→</span></strong><small>温炉半日 · 收益适中</small></button>
   <button class="d-action" type="button"><strong>包下余药<span class="d-arrow">→</span></strong><small>修为大增 · 风险较高</small></button>
   <button class="d-action" type="button"><strong>离开<span class="d-arrow">→</span></strong><small>记住丹号 · 另寻机缘</small></button>
  </div>
 </section>
 <nav class="d-tools" aria-label="修行操作"><button type="button">◌ 内观</button><button type="button">静心</button><button type="button" class="d-tribulation" disabled>渡劫 · 尚缺修为</button></nav>
 <p class="d-note" id="d-feedback" role="status" aria-live="polite" hidden></p>
</main>
<script>
(()=>{const notes={'新封口':'三只瓶子的封口都很新。你还不知道，封口里面的药是哪一炉。','旧丹签':'竹篓里有几十张旧签，其中一张上个月还贴在这个摊位。','瓶底红末':'摊主捻去了瓶底的红末。单凭颜色，还判断不了它是什么。'};const note=document.getElementById('d-cluenote');document.querySelectorAll('.d-clue').forEach(button=>button.addEventListener('click',()=>{const wasOpen=button.getAttribute('aria-expanded')==='true';document.querySelectorAll('.d-clue').forEach(b=>b.setAttribute('aria-expanded','false'));note.hidden=wasOpen;if(!wasOpen){button.setAttribute('aria-expanded','true');note.textContent=notes[button.textContent]}}));document.querySelectorAll('.d-action,.d-tools button:not(:disabled)').forEach(button=>button.addEventListener('click',()=>{const feedback=document.getElementById('d-feedback');feedback.hidden=false;feedback.textContent='这是界面预览。此处仅展示操作反馈，尚未开始本局结算。'}));})();
</script>
</body>
</html>
